        me: '출생신고 뒤 신청을 깜빡해 받을 돈을 놓치는 일이 줄어요. 계좌 확인 동의 같은 절차는 남을 수 있어요.' },
      { d: '2027-04-21', when: '2027. 4. 21.', area: '복지', who: ['senior'],
        name: '기초연금, 국내 5년 이상 거주해야',
        what: '만 65세 이상이라도 19세 이후 국내에 5년 이상 살지 않았으면 원칙적으로 기초연금을 받을 수 없어요. 해외 소득·재산 신고 의무도 생겨요.',
        me: '해외에서 오래 살다 귀국했다면 신청 전에 국내 거주기간을 확인하세요(시행일은 보도 기준).' },
      { d: '2027-05-31', when: '2027. 5. 31. 마감', area: '주거', who: ['home'],
        name: '전세사기 피해자 결정 신청 마감',
        what: '전세사기피해자법 유효기간이 2027년 5월 31일까지라 피해자 결정 신청도 그 전에 해야 해요(2025. 5. 31.까지 최초 계약한 임차인 대상).',
        me: '아직 신청하지 않은 피해 임차인은 마감 전에 관할 시·도(전세피해지원센터)에 신청하세요.' },
      { d: '2027-06-03', when: '2027. 6. 3.', area: '교통', who: ['driver'],
        name: '음주운전 권유·차량 제공·동승 요구 처벌',
        what: '술 마신 걸 알면서 차를 내주거나 운전을 권하거나, 태워 달라고 요구해 함께 타면 3년 이하 징역 또는 1천만원 이하 벌금이에요. 운전기록 정정·말소 요구 제도도 같은 법에 들어갔어요.',
        me: '술자리 뒤 “조금만 운전해”라고 권하거나 차 키를 건네는 것만으로도 처벌될 수 있어요.' },
      { d: '2027-06-10', when: '2027. 6. 10.', area: '노동', who: ['work', 'youth'],
        name: '연차휴가 나눠 쓸 권리 법제화',
        what: '연차를 대통령령으로 정하는 단위로 나눠 쓸 수 있게 근로기준법이 바뀌어요(시행령 입법예고안: 반일 단위, 연 5일 한도). 연차를 썼다고 불이익을 주면 처벌돼요.',
        me: '회사 규정에 반차가 없어도 법에 따라 반일 단위로 연차를 쓸 수 있게 돼요(단위·한도는 시행령 확정 후 확인).' },
      { d: '2027-03-01', when: '2027학년도', area: '교육', who: ['student', 'parent'],
        name: '의대 정원 3,548명 (490명 증원)',
        what: '2027학년도 의대 정원이 3,058명에서 490명 늘어요. 증원분은 서울을 뺀 32개 의대가 지역의사전형으로 뽑아요.',
        me: '의대 지망생은 지역의사전형의 지원 자격(지역 거주·학교)과 졸업 후 지역 근무 조건을 모집요강에서 확인하세요.' },
      { d: '2027-12-31', when: '2027. 12. 31.까지', area: '주거', who: ['home'],
        name: '토허구역 ‘세 낀 집’ 실거주 유예 신청 연장',
        what: '토지거래허가구역에서 세입자가 있는 집을 무주택자가 살 때 실거주를 미뤄 주는 특례 신청 기한이 2027년 12월 31일까지로 1년 늘었어요(갱신계약 1회 포함).',
        me: '집주인은 세입자가 있어도 매도가 쉬워지고, 매수자는 임대차가 끝난 뒤 입주해 2년 실거주하면 돼요.' }
    ];
    ITEMS.sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });

    // ===== 추진 중 (미확정) =====
    var PENDING = [
      { area: '세금', who: ['work', 'biz', 'youth', 'parent'], name: '근로장려금 소득 기준·지급액 확대',
        what: '2026년 세제개편안(국회 심의 중). 통과되면 2027년 소득분부터, 즉 2027년 9월 반기 신청분부터 적용돼요.' },
      { area: '세금', who: ['work', 'biz', 'youth'], name: '가상자산(코인) 과세',
        what: '현행법상 2027. 1. 1. 시행이지만, 정부가 2029년으로 2년 유예를 국회와 추진 중이에요(2026. 11. 5. 발표).' },
      { area: '육아', who: ['youth', 'parent'], name: '결혼세액공제 종료 → 혼인지원금',
        what: '결혼세액공제는 2026년 혼인신고분까지예요. 2027년 혼인신고 부부에게 1인 50만원을 주는 혼인지원금은 예산안 단계예요.' },
      { area: '육아', who: ['parent'], name: '아이맞이지원금·아동기본수당 개편',
        what: '첫만남이용권·부모급여·아동수당을 묶는 개편안이 2027년 예산안에 담겨 국회 심사 중이에요. 금액·시기는 바뀔 수 있어요.' },
      { area: '4대보험', who: ['work', 'biz', 'youth'], name: '고용보험료율 인상·실업급여 주 6일 기준',
        what: '실업급여 보험료율 1.8% → 2.0%(근로자·사업주 각 0.1%p), 구직급여 주 7일 → 6일 기준이 정부 개편안이에요.' },
      { area: '의료', who: ['senior'], name: '희귀·중증난치 본인부담 인하, 어르신 임플란트',
        what: '본인부담률 10% → 7%(2026. 12. 진료분 예정), 치아가 하나도 없는 65세 이상 임플란트 2개 지원(2027년)이 건정심 의결 후 하위법령 절차 중이에요.' },
      { area: '교통', who: ['driver'], name: '하이브리드차 개별소비세 감면 종료',
        what: '감면 기한이 2026. 12. 31.이고 정부 세제개편안은 연장하지 않는 안이에요. 국회에서 바뀔 수 있어요.' },
      { area: '복지', who: ['senior'], name: '2027년 기초연금액',
        what: '해마다 물가를 반영해 1월에 새 금액과 선정기준액이 고시돼요(2026년 단독 최대 월 34만 9,700원).' },
      { area: '병역', who: ['youth', 'student'], name: '2027년 병사 봉급',
        what: '국회 예산 심사 뒤 공무원보수규정 개정으로 정해져요(2026년 병장 기본급 월 150만원).' },
      { area: '교육', who: ['student', 'parent'], name: '지방 국립대 등록금 지원·방과후 이용권 확대',
        what: '지방 국립대 신입생 등록금 지원, 방과후 이용권 초4 확대, 3~5세 무상교육·보육 확대가 2027년 예산안에 담겨 심사 중이에요.' }
    ];

    function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
    function nw(t) { return '<span class="kch-nowrap">' + esc(t) + '</span>'; }

    function selected() { return $$('.kch-chip.kch-on').map(function (b) { return b.getAttribute('data-v'); }); }
    function norm(t) { return String(t).replace(/\s+/g, '').toLowerCase(); }
    function hit(item, sel, q) {
      if (sel.length && !item.who.some(function (w) { return sel.indexOf(w) >= 0; })) return false;
      if (q && norm(item.name + item.what + (item.me || '') + item.area).indexOf(q) < 0) return false;
      return true;
    }

    function render() {
      var sel = selected();
      var raw = qIn.value.trim();
      var q = norm(raw);
      msg.textContent = '';
      qIn.classList.remove('kch-bad');
      if (raw && !/[0-9A-Za-z가-힣]/.test(raw)) {
        qIn.classList.add('kch-bad');
        msg.textContent = '키워드는 한글·영문·숫자로 입력해 주세요.';
        result.classList.remove('kch-show');
        lastText = '';
        return;
      }
      var list = ITEMS.filter(function (i) { return hit(i, sel, q); });
      var plist = PENDING.filter(function (i) { return hit(i, sel, q); });
      if (raw && !list.length && !plist.length) {
        qIn.classList.add('kch-bad');
        msg.textContent = '‘' + raw + '’에 맞는 변화가 없어요. 다른 낱말로 찾아보세요.';
        result.classList.remove('kch-show');
        lastText = '';
        return;
      }
      var who = sel.map(function (s) { return WHO[s]; });
      $('[data-mlabel]').textContent = '2027년 확정된 변화 (' + (who.length ? who.join('·') : '전체') + (raw ? ' · ‘' + raw + '’' : '') + ')';
      $('[data-count]').textContent = list.length;
      var jan = list.filter(function (i) { return i.d.slice(0, 7) === '2027-01'; }).length;
      $('[data-summary]').textContent = list.length ? '1월 시행 ' + jan + '개 · 그 밖의 시기 ' + (list.length - jan) + '개 · 추진 중 ' + plist.length + '개' : '확정된 변화는 없고 추진 중인 것만 ' + plist.length + '개 있어요';
      $('[data-list]').innerHTML = list.length ? list.map(function (i) {
        return '<li class="kch-card"><div class="kch-card-h"><p class="kch-name">' + esc(i.name) + '</p><span class="kch-badge">' + esc(i.area) + '</span></div>' +
          '<p class="kch-row"><b>시행</b><span>' + nw(i.when) + '</span></p>' +
          '<p class="kch-row"><b>바뀌는 점</b><span>' + esc(i.what) + '</span></p>' +
          '<p class="kch-row kch-me"><b>나에게</b><span>' + esc(i.me) + '</span></p></li>';
      }).join('') : '<li class="kch-empty">고른 상황에 해당하는 확정 변화가 없어요.</li>';
      $('[data-plist]').innerHTML = plist.length ? plist.map(function (i) {
        return '<li class="kch-card kch-pend"><div class="kch-card-h"><p class="kch-name">' + esc(i.name) + '</p><span class="kch-badge kch-gray">추진 중 · ' + esc(i.area) + '</span></div>' +
          '<p class="kch-row"><b>상태</b><span>' + esc(i.what) + '</span></p></li>';
      }).join('') : '<li class="kch-empty">고른 상황에 해당하는 추진 중 항목이 없어요.</li>';
      result.classList.add('kch-show');

      lastText = '[2027년 달라지는 것 - 내 체크리스트]\n내 상황: ' + (who.length ? who.join(', ') : '전체') + (raw ? ' / 키워드: ' + raw : '') + '\n' +
        (list.length ? '\n■ 확정된 변화 ' + list.length + '개\n' + list.map(function (i) {
          return '☐ ' + i.name + ' (' + i.when + ')\n   - ' + i.me;
        }).join('\n') : '\n■ 확정된 변화 없음') +
        (plist.length ? '\n\n■ 추진 중 (미확정)\n' + plist.map(function (i) { return '- ' + i.name + ': ' + i.what; }).join('\n') : '') +
        '\n\n※ 2026. 11. 20. 기준. 시행 전 정부 공식 발표로 다시 확인하세요.';
    }

    $('[data-chips]').addEventListener('click', function (e) {
      var c = e.target.closest('.kch-chip');
      if (!c) return;
      var on = !c.classList.contains('kch-on');
      c.classList.toggle('kch-on', on);
      c.setAttribute('aria-pressed', on);
      render();
    });
    qIn.addEventListener('input', render);

    $('[data-reset]').addEventListener('click', function () {
      $$('.kch-chip').forEach(function (b) { b.classList.remove('kch-on'); b.setAttribute('aria-pressed', 'false'); });
      qIn.value = '';
      render();
      var first = $('.kch-chip'); if (first) first.focus();
    });

    $('[data-copy]').addEventListener('click', function () {
      var btn = this, text = lastText;
      if (!result.classList.contains('kch-show') || !text) { msg.textContent = '복사할 결과가 없어요. 키워드를 고친 뒤 다시 눌러 주세요.'; return; }
      function done() { btn.textContent = '복사됐어요 ✓'; setTimeout(function () { btn.textContent = '결과 복사'; }, 1500); }
      function fallback() { var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); done(); }
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
      else fallback();
    });

    render();
  })();
  </script>
