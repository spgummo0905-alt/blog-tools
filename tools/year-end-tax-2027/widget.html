        } },
      { id: 'pension', q: '연금저축이나 IRP에 돈을 넣었나요?', h: '퇴직연금 개인 추가 납입 포함',
        items: function () { return [
          { k: 'auto', t: '연금저축·IRP 납입액', d: '간소화에 나와요.' },
          { k: 'check', t: '세액공제 한도', d: '연금저축 600만원, IRP와 합쳐 900만원까지예요. 12월에 넣은 금액도 포함돼요.' }
        ]; } },
      { id: 'donate', q: '기부금을 냈나요?', h: '종교단체, 공익단체, 고향사랑기부 등',
        items: function () { return [
          { k: 'doc', t: '기부금 영수증', d: '종교단체 등 간소화에 자료를 안 내는 곳이 많아요. 기부처에서 직접 받아요.' },
          { k: 'check', t: '고향사랑기부금 공제율 상향', n: 1, d: '10만원까지는 사실상 전액, 10만원 초과~20만원 이하 부분은 2026년 기부분부터 40% 세액공제예요.' }
        ]; } },
      { id: 'house', q: '주택청약종합저축에 돈을 넣었나요?', h: '무주택 세대주 또는 그 배우자',
        items: function (p) {
          if (p !== null && p > 7000) return [{ k: 'no', t: '주택청약 소득공제', d: '총급여 7천만원 이하만 받을 수 있어요.' }];
          return [
            { k: 'doc', t: '가입 은행에 무주택 확인서 제출', d: '내지 않았으면 간소화에 납입액이 나와도 공제가 안 될 수 있어요. 은행 앱이나 창구에서 확인해요.' },
            { k: 'check', t: '공제 한도', d: '연 300만원 납입분까지, 납입액의 40% 소득공제예요.' }
          ];
        } },
      { id: 'youth', q: '중소기업에 다니는 청년인가요?', h: '취업할 때 15~34세(군 복무 기간은 빼고 계산)',
        items: function () { return [
          { k: 'doc', t: '중소기업 취업자 소득세 감면 신청서', d: '회사에 한 번 내면 취업일부터 5년간 소득세 90%(연 200만원까지) 감면돼요. 아직 안 냈다면 지금이라도 내요.' }
        ]; } },
      { id: 'marry', q: '2024~2026년에 혼인신고를 했나요?', h: '생애 한 번만 받을 수 있어요',
        items: function () { return [
          { k: 'check', t: '결혼세액공제 50만원', d: '부부 각각 50만원. 2026년 혼인신고분까지만 적용돼요. 2024·2025년 신고 때 이미 받았다면 또 받을 수 없어요.' }
        ]; } },
      { id: 'disabled', q: '본인이나 가족 중 장애인이 있나요?', h: '장애인복지법상 장애인, 국가유공자, 중증환자 등',
        items: function () { return [
          { k: 'doc', t: '장애인증명서 또는 장애인등록증 사본', d: '중증환자는 병원에서 장애인증명서를 받아요. 장애인 가족은 나이 제한 없이 부양가족 공제가 돼요.' },
          { k: 'auto', t: '장애인 전용 보장성 보험료', d: '간소화에 나와요. 일반 보장성 보험과 따로 연 100만원까지 공제돼요.' }
        ]; } }
    ];
    var GROUPS = [
      { k: 'doc', t: '직접 챙길 서류', s: '간소화에 없거나 빠지기 쉬워요' },
      { k: 'check', t: '꼭 확인할 조건', s: '' },
      { k: 'auto', t: '간소화에서 나와요', s: '내려받아 확인만' },
      { k: 'no', t: '대상이 아니에요', s: '총급여 기준' }
    ];

    var $ = function (s) { return root.querySelector(s); };
    var $$ = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
    var payI = $('[data-pay]'), msg = $('[data-msg]'), result = $('[data-result]');
    var answers = {}, lastText = '';

    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

    // 질문 목록 그리기
    var qBox = $('[data-qs]');
    QS.forEach(function (q) {
      var row = el('div', 'kye-q'); row.dataset.q = q.id;
      var body = el('div', 'kye-q-body');
      body.appendChild(el('p', 'kye-q-t', q.q));
      body.appendChild(el('p', 'kye-q-h', q.h));
      var yn = el('div', 'kye-yn'); yn.setAttribute('role', 'group'); yn.setAttribute('aria-label', q.q);
      [['1', '예'], ['0', '아니오']].forEach(function (o) {
        var b = el('button', 'kye-ynb', o[1]); b.type = 'button'; b.dataset.v = o[0]; b.setAttribute('aria-pressed', 'false');
        b.addEventListener('click', function () {
          var v = o[0] === '1';
          if (answers[q.id] === v) delete answers[q.id]; else answers[q.id] = v; // 같은 버튼을 다시 누르면 선택 취소
          paintRow(row, q.id); calc();
        });
        yn.appendChild(b);
      });
      row.appendChild(body); row.appendChild(yn);
      qBox.appendChild(row);
    });

    function paintRow(row, id) {
      var a = answers[id];
      row.classList.toggle('kye-yes', a === true);
      Array.prototype.forEach.call(row.querySelectorAll('.kye-ynb'), function (b) {
        var on = a !== undefined && (b.dataset.v === '1') === a;
        b.classList.toggle('kye-on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }

    // 총급여(만원). 비어 있으면 null, 잘못되면 false
    function readPay() {
      var raw = payI.value.replace(/,/g, '');
      if (!raw) { payI.classList.remove('kye-bad'); msg.textContent = ''; return null; }
      var p = +raw;
      var bad = p < 1 ? '총급여는 1만원 이상으로 넣어 주세요.' : p > 100000 ? '만원 단위로 넣어 주세요(예: 4,500). 10억원을 넘을 수 없어요.' : '';
      payI.classList.toggle('kye-bad', !!bad);
      msg.textContent = bad;
      return bad ? false : p;
    }

    function calc() {
      var p = readPay();
      var answered = Object.keys(answers).length;
      $('[data-progress]').textContent = answered ? QS.length + '개 질문 중 ' + answered + '개 답했어요' + (answered < QS.length ? ' · 나머지는 아니오로 봐요' : '') : '';
      if (p === false || !answered) { result.classList.remove('kye-show'); return; }

      var items = BASE.slice(), yes = [];
      QS.forEach(function (q) { if (answers[q.id]) { yes.push(q.q); items = items.concat(q.items(p)); } });

      var box = $('[data-groups]'); box.innerHTML = '';
      var lines = ['[2027 연말정산(2026년 귀속) 할 일]'];
      if (p !== null) lines.push('총급여(예상): ' + p.toLocaleString('ko-KR') + '만원');
      var count = 0;
      GROUPS.forEach(function (g) {
        var list = items.filter(function (it) { return it.k === g.k; });
        if (!list.length) return;
        if (g.k !== 'no') count += list.length;
        var sec = el('div', 'kye-grp kye-grp-' + g.k);
        var head = el('p', 'kye-grp-t', g.t); if (g.s) head.appendChild(el('span', '', g.s));
        sec.appendChild(head);
        var ul = el('ul', 'kye-list');
        lines.push('', '■ ' + g.t + (g.s ? ' (' + g.s + ')' : ''));
        list.forEach(function (it) {
          var li = el('li', 'kye-item');
          var t = el('p', 'kye-item-t', it.t);
          if (it.n) t.appendChild(el('span', 'kye-new', '2026 변경'));
          li.appendChild(t); li.appendChild(el('p', 'kye-item-d', it.d));
          ul.appendChild(li);
          lines.push((g.k === 'no' ? '- ' : '□ ') + it.t + (it.n ? ' [2026 변경]' : '') + ': ' + it.d);
        });
        sec.appendChild(ul); box.appendChild(sec);
      });
      $('[data-count]').textContent = count;
      var docs = items.filter(function (it) { return it.k === 'doc'; }).length;
      $('[data-sub]').textContent = '직접 챙길 서류 ' + docs + '개 · 해당 항목 ' + yes.length + '개';
      lines.push('', '※ 간소화 서비스 개통일(2027년 1월)은 국세청 발표 후 확인하세요. 작년은 2026. 1. 15.이었어요.');
      lastText = lines.join('\n');
      result.classList.add('kye-show');
    }

    payI.addEventListener('input', function () {
      var v = payI.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 9);
      payI.value = v ? (+v).toLocaleString('ko-KR') : '';
      calc();
    });

    $('[data-reset]').addEventListener('click', function () {
      answers = {}; payI.value = '';
      $$('.kye-q').forEach(function (r) { paintRow(r, r.dataset.q); });
      calc();
      var first = root.querySelector('.kye-ynb'); if (first) first.focus();
    });

    $('[data-copy]').addEventListener('click', function () {
      var btn = this;
      function done() { btn.textContent = '복사됐어요 ✓'; setTimeout(function () { btn.textContent = '결과 복사'; }, 1500); }
      function fallback() { var ta = document.createElement('textarea'); ta.value = lastText; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(lastText).then(done, fallback);
      else fallback();
    });
  })();
  </script>
</div>
