<!-- 맞춤법 퀴즈 위젯 시작 : 티스토리/블로거/워드프레스 글의 HTML 모드에 그대로 붙여 넣으세요 -->
<div class="ksp" data-ksp>
  <style>
    .ksp{--ksp-accent:#3b6ef5;--ksp-accent-soft:#eef3ff;--ksp-text:#1d2433;--ksp-sub:#6b7385;--ksp-line:#e3e7ef;--ksp-bg:#fff;--ksp-red:#e0565b;--ksp-red-soft:#fff2f2;
      box-sizing:border-box;max-width:520px;margin:24px auto;padding:24px;border:1px solid var(--ksp-line);border-radius:20px;background:var(--ksp-bg);
      color:var(--ksp-text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
      line-height:1.5;text-align:left;box-shadow:0 6px 24px rgba(30,45,90,.06);word-break:keep-all;overflow-wrap:break-word}
    .ksp [hidden]{display:none!important}
    .ksp *,.ksp *::before,.ksp *::after{box-sizing:border-box;margin:0;padding:0;font-family:inherit}
    .ksp .ksp-title{font-size:20px;font-weight:700;letter-spacing:-.02em;border:0;background:none}
    .ksp .ksp-desc{margin-top:4px;font-size:14px;color:var(--ksp-sub)}
    .ksp .ksp-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:16px;padding:4px;border-radius:14px;background:#f1f3f8}
    .ksp .ksp-tab{height:44px;border:0;border-radius:10px;background:none;color:var(--ksp-sub);font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
    .ksp .ksp-tab:hover{color:var(--ksp-text)}
    .ksp .ksp-tab.ksp-on{background:#fff;color:var(--ksp-accent);box-shadow:0 1px 4px rgba(30,45,90,.12)}
    .ksp .ksp-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px;font-size:13px;color:var(--ksp-sub)}
    .ksp .ksp-top b{color:var(--ksp-text)}
    .ksp .ksp-track{height:8px;margin-top:8px;border-radius:999px;background:#eef0f5;overflow:hidden}
    .ksp .ksp-fill{height:100%;width:0;border-radius:999px;background:var(--ksp-accent);transition:width .3s ease}
    .ksp .ksp-q{margin-top:14px;padding:22px 18px;border-radius:16px;background:var(--ksp-accent-soft);text-align:center}
    .ksp .ksp-q-k{font-size:13px;color:var(--ksp-sub)}
    .ksp .ksp-q-s{margin-top:6px;font-size:19px;font-weight:700;line-height:1.6;letter-spacing:-.01em}
    .ksp .ksp-blank{display:inline-block;min-width:56px;padding:0 6px;border-bottom:2.5px solid var(--ksp-accent);color:var(--ksp-accent);white-space:nowrap}
    .ksp .ksp-blank.ksp-filled{min-width:0;padding:0 1px}
    .ksp .ksp-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .ksp .ksp-opt{height:56px;padding:0 8px;border:1.5px solid var(--ksp-line);border-radius:12px;background:#fff;color:var(--ksp-text);font-size:19px;font-weight:700;
      cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .1s}
    .ksp .ksp-opt:hover:not(:disabled){border-color:#c9d3ea;background:#f8f9fc}
    .ksp .ksp-opt:active:not(:disabled){transform:scale(.98)}
    .ksp .ksp-opt:disabled{cursor:default}
    .ksp .ksp-opt.ksp-ok{border-color:var(--ksp-accent);background:var(--ksp-accent-soft);color:var(--ksp-accent)}
    .ksp .ksp-opt.ksp-ng{border-color:var(--ksp-red);background:var(--ksp-red-soft);color:var(--ksp-red)}
    .ksp .ksp-opt.ksp-dim{color:#b3b9c6}
    .ksp .ksp-fb{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(8px);transition:grid-template-rows .35s ease,opacity .35s ease,transform .35s ease}
    .ksp .ksp-fb.ksp-show,.ksp .ksp-result.ksp-show{grid-template-rows:1fr;opacity:1;transform:none}
    .ksp .ksp-fb-inner,.ksp .ksp-result-inner{overflow:hidden}
    .ksp .ksp-exp{margin-top:12px;padding:14px 16px;border:1px solid var(--ksp-line);border-radius:14px;background:#fff;font-size:14px}
    .ksp .ksp-verdict{font-size:15px;font-weight:700;color:var(--ksp-accent)}
    .ksp .ksp-verdict.ksp-bad{color:var(--ksp-red)}
    .ksp .ksp-tip{margin-top:6px}
    .ksp .ksp-src{margin-top:6px;font-size:12.5px;color:var(--ksp-sub)}
    .ksp .ksp-result{display:grid;grid-template-rows:0fr;opacity:0;transform:translateY(8px);transition:grid-template-rows .35s ease,opacity .35s ease,transform .35s ease}
    .ksp .ksp-main{margin-top:18px;padding:22px 20px;border-radius:16px;background:var(--ksp-accent-soft);text-align:center}
    .ksp .ksp-main-label{font-size:14px;color:var(--ksp-sub)}
    .ksp .ksp-score{margin-top:2px;font-size:44px;font-weight:800;letter-spacing:-.03em;color:var(--ksp-accent);line-height:1.2}
    .ksp .ksp-score small{font-size:22px;font-weight:700;margin-left:2px;color:var(--ksp-sub)}
    .ksp .ksp-grade{margin-top:6px;font-size:14px;color:var(--ksp-sub)}
    .ksp .ksp-h{margin-top:16px;font-size:14px;font-weight:700}
    .ksp .ksp-list{list-style:none;margin-top:8px}
    .ksp .ksp-item{padding:12px 14px;border:1px solid var(--ksp-line);border-radius:14px;background:#fff;font-size:14px}
    .ksp .ksp-item+.ksp-item{margin-top:8px}
    .ksp .ksp-item-k{font-weight:700}
    .ksp .ksp-item-k span{margin-left:6px;font-size:12.5px;font-weight:600;color:var(--ksp-red)}
    .ksp .ksp-item-s{margin-top:4px}
    .ksp .ksp-item-s b{color:var(--ksp-accent)}
    .ksp .ksp-allok{margin-top:8px;font-size:14px;color:var(--ksp-sub)}
    .ksp .ksp-label{display:block;margin:20px 0 8px;font-size:14px;font-weight:600;color:var(--ksp-text)}
    .ksp .ksp-in{width:100%;height:52px;padding:0 14px;border:1.5px solid var(--ksp-line);border-radius:12px;background:#f8f9fc;
      font-size:18px;font-weight:600;color:var(--ksp-text);outline:none;transition:border-color .2s,background .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
    .ksp .ksp-in::placeholder{color:#b3b9c6;font-weight:500}
    .ksp .ksp-in:focus{border-color:var(--ksp-accent);background:#fff;box-shadow:0 0 0 4px rgba(59,110,245,.12)}
    .ksp .ksp-msg{min-height:20px;margin-top:10px;font-size:13px;color:var(--ksp-red)}
    .ksp .ksp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
    .ksp .ksp-chip{height:32px;padding:0 12px;white-space:nowrap;border:1.5px solid var(--ksp-line);border-radius:999px;background:#fff;color:var(--ksp-sub);
      font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
    .ksp .ksp-chip:hover{border-color:#c9d3ea;color:var(--ksp-text)}
    .ksp .ksp-card{padding:16px;border:1px solid var(--ksp-line);border-radius:14px;background:#fff;font-size:14px}
    .ksp .ksp-card+.ksp-card{margin-top:8px}
    .ksp .ksp-card-k{font-size:17px;font-weight:800;color:var(--ksp-accent)}
    .ksp .ksp-pair{margin-top:4px;font-size:13px;color:var(--ksp-sub)}
    .ksp .ksp-ex{margin-top:8px;padding-left:16px}
    .ksp .ksp-ex li+li{margin-top:2px}
    .ksp .ksp-ex b{color:var(--ksp-accent)}
    .ksp .ksp-note{margin-top:12px;font-size:12.5px;color:var(--ksp-sub)}
    .ksp .ksp-actions{display:flex;gap:8px;margin-top:14px}
    .ksp .ksp-btn{flex:1;height:44px;padding:0 8px;border:1.5px solid var(--ksp-line);border-radius:12px;background:#fff;color:var(--ksp-text);
      font-size:14px;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}
    .ksp .ksp-btn:hover{background:#f4f6fa}
    .ksp .ksp-btn:active{transform:scale(.98)}
    .ksp .ksp-btn.ksp-primary{border-color:var(--ksp-accent);background:var(--ksp-accent);color:#fff}
    .ksp .ksp-btn.ksp-primary:hover{background:#2f5fe0}
    @media (max-width:420px){.ksp{padding:18px;border-radius:16px}.ksp .ksp-score{font-size:38px}.ksp .ksp-in{font-size:17px}.ksp .ksp-q{padding:18px 14px}.ksp .ksp-q-s{font-size:18px}}
    @media (prefers-reduced-motion:reduce){.ksp .ksp-fb,.ksp .ksp-result,.ksp .ksp-in,.ksp .ksp-btn,.ksp .ksp-opt,.ksp .ksp-chip,.ksp .ksp-tab,.ksp .ksp-fill{transition:none}}
  </style>

  <p class="ksp-title">헷갈리는 맞춤법 퀴즈</p>
  <p class="ksp-desc">빈칸에 맞는 말을 고르세요. 10문제가 무작위로 나와요.</p>

  <div class="ksp-tabs" role="tablist" aria-label="기능 선택">
    <button type="button" class="ksp-tab ksp-on" role="tab" aria-selected="true" data-tab="quiz">퀴즈 풀기</button>
    <button type="button" class="ksp-tab" role="tab" aria-selected="false" data-tab="find">빠른 찾기</button>
  </div>

  <div data-pane="quiz" role="tabpanel">
    <div data-play>
      <div class="ksp-top"><span><b data-num>1</b> / <span data-total>10</span> 문제</span><span>맞힌 문제 <b data-right>0</b>개</span></div>
      <div class="ksp-track"><div class="ksp-fill" data-bar></div></div>
      <div class="ksp-q">
        <p class="ksp-q-k" data-qk></p>
        <p class="ksp-q-s" data-qs></p>
      </div>
      <div class="ksp-opts" data-opts>
        <button type="button" class="ksp-opt" data-opt="0"></button>
        <button type="button" class="ksp-opt" data-opt="1"></button>
      </div>
      <div class="ksp-fb" data-fb aria-live="polite">
        <div class="ksp-fb-inner">
          <div class="ksp-exp">
            <p class="ksp-verdict" data-verdict></p>
            <p class="ksp-tip" data-tip></p>
            <p class="ksp-src" data-src></p>
          </div>
          <div class="ksp-actions"><button type="button" class="ksp-btn ksp-primary" data-next>다음 문제</button></div>
        </div>
      </div>
    </div>

    <div class="ksp-result" data-result aria-live="polite">
      <div class="ksp-result-inner">
        <div class="ksp-main">
          <p class="ksp-main-label">내 점수</p>
          <p class="ksp-score"><span data-score>0</span><small>/ 10</small></p>
          <p class="ksp-grade" data-grade></p>
        </div>
        <p class="ksp-h" data-wrong-h>틀린 문제 복습</p>
        <ul class="ksp-list" data-wrong></ul>
        <p class="ksp-allok" data-allok hidden>모두 맞혔어요! 다시 풀면 다른 문제가 나와요.</p>
        <div class="ksp-actions">
          <button type="button" class="ksp-btn" data-reset>다시 풀기</button>
          <button type="button" class="ksp-btn ksp-primary" data-copy>결과 복사</button>
        </div>
      </div>
    </div>
  </div>

  <div data-pane="find" role="tabpanel" hidden>
    <label class="ksp-label" for="ksp-find">찾을 단어</label>
    <input class="ksp-in" id="ksp-find" data-find type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="예: 되, 로서, 며칠, 결제">
    <p class="ksp-msg" data-msg role="status" aria-live="polite"></p>
    <div data-chips-wrap>
      <p class="ksp-note" style="margin-top:0">전체 항목 (누르면 바로 보여요)</p>
      <div class="ksp-chips" data-chips></div>
    </div>
    <div data-cards></div>
  </div>

  <p class="ksp-note">국립국어원 「한글 맞춤법」과 『표준국어대사전』 기준이에요.</p>

  <script>
  (function () {
    var me = document.currentScript || (function (s) { return s[s.length - 1]; })(document.getElementsByTagName('script'));
    var root = me.closest('[data-ksp]');
    if (!root || root.__ksp) return;
    root.__ksp = true;

    // 문제 데이터: k 항목, o 옳은 것, x 틀린 것(이 문장에 안 맞는 것), n 1이면 x는 아예 틀린 표기, s 예문(___ 자리에 들어감), t 쉬운 구별법, b 근거
    var Q = [
      { k: '되/돼', o: '돼', x: '되', s: '그렇게 하면 안 ___.', t: '‘돼’는 ‘되어’가 줄어든 말이에요. 그 자리에 ‘해’를 넣어 말이 되면 ‘돼’, ‘하’가 어울리면 ‘되’예요(안 해 → 안 돼).', b: '한글 맞춤법 제35항 [붙임 2] (되어 → 돼, 되었다 → 됐다)' },
      { k: '되/돼', o: '되', x: '돼', s: '좋은 사람이 ___고 싶어요.', t: '‘하고 싶어요’는 되고 ‘해고 싶어요’는 어색하죠. ‘하’ 자리면 ‘되’예요.', b: '한글 맞춤법 제35항 [붙임 2] (되어 → 돼, 되었다 → 됐다)' },
      { k: '되/돼', o: '됐어', x: '됬어', n: 1, s: '이제 준비 다 ___.', t: '‘되었어’가 줄면 ‘됐어’예요. ‘됬’이라는 글자는 쓰지 않아요.', b: '한글 맞춤법 제35항 [붙임 2] (되어 → 돼, 되었다 → 됐다)' },
      { k: '안/않', o: '안', x: '않', s: '오늘은 숙제를 ___ 했다.', t: '‘아니’로 바꿔 말이 되면 ‘안’, ‘아니하’로 바꿔 말이 되면 ‘않’이에요. ‘-지’ 뒤에는 대부분 ‘않’이 와요.', b: '표준국어대사전 ‘안’(‘아니’의 준말), ‘않다’(‘아니하다’의 준말)' },
      { k: '안/않', o: '않', x: '안', s: '그 영화는 생각보다 재미있지 ___았다.', t: '‘재미있지 아니하였다’로 바꿀 수 있으니 ‘않’이에요.', b: '표준국어대사전 ‘안’(‘아니’의 준말), ‘않다’(‘아니하다’의 준말)' },
      { k: '로서/로써', o: '로서', x: '로써', s: '부모___ 책임을 다했다.', t: '자격·신분·지위면 ‘로서’, 수단·도구·재료면 ‘로써’예요. ‘부모라는 자격으로’니까 ‘로서’.', b: '한글 맞춤법 제57항' },
      { k: '로서/로써', o: '로써', x: '로서', s: '대화___ 갈등을 풀었다.', t: '‘대화를 수단으로 하여’라는 뜻이라 ‘로써’예요.', b: '한글 맞춤법 제57항' },
      { k: '웬/왠지', o: '왠지', x: '웬지', n: 1, s: '오늘은 ___ 기분이 좋아.', t: '‘왠’은 ‘왜인지’가 줄어든 ‘왠지’ 하나뿐이에요. 나머지는 모두 ‘웬’(웬일, 웬만하다, 웬 떡)이에요.', b: '표준국어대사전 ‘왠지’, ‘웬’, ‘웬일’' },
      { k: '웬/왠지', o: '웬일', x: '왠일', n: 1, s: '___로 먼저 전화를 다 했어?', t: '‘어찌 된 일’이라는 뜻의 ‘웬일’이에요. ‘왜인지’로 바꿀 수 없으면 ‘웬’이에요.', b: '표준국어대사전 ‘왠지’, ‘웬’, ‘웬일’' },
      { k: '든지/던지', o: '던지', x: '든지', s: '얼마나 춥___ 손이 꽁꽁 얼었다.', t: '지난 일을 떠올리면 ‘던’, 여럿 중에서 고르거나 상관없다는 뜻이면 ‘든’이에요.', b: '한글 맞춤법 제56항' },
      { k: '든지/던지', o: '든지', x: '던지', s: '밥이___ 빵이___ 아무거나 좋아.', t: '고르는 뜻이니 ‘든지’예요.', b: '한글 맞춤법 제56항' },
      { k: '며칠', o: '며칠', x: '몇 일', n: 1, s: '오늘이 ___이지?', t: '날짜든 기간이든 언제나 ‘며칠’로 써요. ‘몇 일’, ‘몇일’은 쓰지 않아요.', b: '한글 맞춤법 제27항 [붙임 2], 표준국어대사전 ‘며칠’' },
      { k: '금세', o: '금세', x: '금새', n: 1, s: '아이가 ___ 잠들었다.', t: '‘금시에’가 줄어든 말이라 ‘금세’예요. (‘요새’는 ‘요사이’가 줄어서 ‘새’) ‘금새’는 물건값을 뜻하는 다른 말이에요.', b: '표준국어대사전 ‘금세’' },
      { k: '어떻게/어떡해', o: '어떡해', x: '어떻게', s: '지갑을 잃어버렸어. 나 ___?', t: '‘어떡해’는 ‘어떻게 해’가 줄어든 말이라 문장 끝에 와요. 뒤에 다른 말이 이어지면 ‘어떻게’예요.', b: '표준국어대사전 ‘어떡하다’, ‘어떻다’, 국립국어원 「한글 맞춤법의 이해」' },
      { k: '어떻게/어떡해', o: '어떻게', x: '어떡해', s: '이 문제는 ___ 풀어요?', t: '뒤에 ‘풀어요’가 이어지니 ‘어떻게’예요.', b: '표준국어대사전 ‘어떡하다’, ‘어떻다’, 국립국어원 「한글 맞춤법의 이해」' },
      { k: '바라/바래', o: '바라', x: '바래', s: '꼭 합격하길 ___.', t: '소망은 ‘바라다’라서 바라, 바랐다, 바람으로 써요. ‘바래다’는 색이 변한다는 뜻이에요.', b: '표준국어대사전 ‘바라다’, ‘바래다’, 표준어 규정 제11항(‘바램’은 비표준어)' },
      { k: '바라/바래', o: '바랬다', x: '바랐다', s: '오래된 사진이 누렇게 ___.', t: '색이 변했으니 ‘바래다’의 과거형 ‘바랬다’예요.', b: '표준국어대사전 ‘바라다’, ‘바래다’, 표준어 규정 제11항(‘바램’은 비표준어)' },

    }
    findI.addEventListener('input', find);
    findI.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); findI.blur(); } });

    start();
  })();
  </script>
</div>
